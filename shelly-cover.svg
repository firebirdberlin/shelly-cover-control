<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Outer Window Frame (Dark slate gray to anchor the design) -->
  <rect x="1" y="1" width="14" height="14" rx="1.5" fill="none" stroke="#2E3440" stroke-width="1.2"/>
  
  <!-- Rainbow Shutter Slats (High contrast, vibrant spectrum) -->
  <rect x="3" y="3" width="10" height="1.2" rx="0.3" fill="#E53935"/> <!-- Red -->
  <rect x="3" y="5" width="10" height="1.2" rx="0.3" fill="#FB8C00"/> <!-- Orange -->
  <rect x="3" y="7" width="10" height="1.2" rx="0.3" fill="#FDD835"/> <!-- Yellow -->
  <rect x="3" y="9" width="10" height="1.2" rx="0.3" fill="#43A047"/> <!-- Green -->
  <rect x="3" y="11" width="10" height="1.2" rx="0.3" fill="#1E88E5"/> <!-- Blue -->
  <rect x="3" y="13" width="10" height="1.2" rx="0.3" fill="#8E24AA"/> <!-- Violet / Purple -->
</svg>
